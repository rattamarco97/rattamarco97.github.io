# Welcome to Jekyll!
#
# This config file contains settings that affect the entire site.

# -----------------------------------------------------------------------------
# Basic Site Settings
# -----------------------------------------------------------------------------

locale                   : "en-US"
site_theme               : "default"

title                    : "Marco Ratta"
title_separator          : "-"
name                     : &name "Marco Ratta"

description              : &description "Statistical Methodologist and Researcher in Statistics"

url                      : "https://rattamarco97.github.io"
baseurl                  : ""
repository               : "rattamarco97/rattamarco97.github.io"


# -----------------------------------------------------------------------------
# Site Author
# -----------------------------------------------------------------------------

author:
  # Biographic information
  avatar           : "002.jpg.jpeg"
  name             : "Marco Ratta"
  pronouns         :
  bio              : "Statistical Methodologist and Researcher in Statistics"
  location         : "France"
  employer         : "Saryga"
  uri              :
  email            : "rattamarco97@gmail.com"

  # Academic websites
  academia         : "https://www.polito.it/personale?p=marco.ratta"
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=rPkTPigAAAAJ&hl=it"
  inspire-hep      :
  impactstory      :
  orcid            : "https://orcid.org/0009-0007-0614-5656"
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     : "https://www.researchgate.net/profile/Marco-Ratta-2"
  scopus           :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "rattamarco97"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "https://www.linkedin.com/in/marco-ratta-2b994313b/"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# -----------------------------------------------------------------------------
# Publication Categories
# -----------------------------------------------------------------------------

publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"


# -----------------------------------------------------------------------------
# Site Settings
# -----------------------------------------------------------------------------

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false


# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------

comments:
  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :

  staticman:
    allowedFields        : ["name", "email", "url", "message"]
    branch               : "master"
    commitMessage        : "New comment."
    filename             : "comment-{@timestamp}"
    format               : "yml"
    moderation           : true
    path                 : "_data/comments/{options.slug}"
    requiredFields       : ["name", "email", "message"]

    transforms:
      email              : "md5"

    generatedFields:
      date:
        type             : "date"
        options:
          format         : "iso8601"


# -----------------------------------------------------------------------------
# Atom Feed
# -----------------------------------------------------------------------------

atom_feed:
  hide                   : false
  path                   :


# -----------------------------------------------------------------------------
# SEO
# -----------------------------------------------------------------------------

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# -----------------------------------------------------------------------------
# Social Sharing
# -----------------------------------------------------------------------------

twitter:
  username               :

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :
og_description           :

social:
  type                   : "Person"
  name                   : "Marco Ratta"
  links:
    - "https://scholar.google.com/citations?user=rPkTPigAAAAJ&hl=it"
    - "https://orcid.org/0009-0007-0614-5656"
    - "https://www.linkedin.com/in/marco-ratta-2b994313b/"
    - "https://github.com/rattamarco97"


# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------

analytics:
  provider               : false

  google:
    tracking_id          :


# -----------------------------------------------------------------------------
# Files
# -----------------------------------------------------------------------------

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                  : "utf-8"
markdown_ext              : "markdown,mkdown,mkdn,mkd,md"


# -----------------------------------------------------------------------------
# Conversion
# -----------------------------------------------------------------------------

markdown                  : kramdown
highlighter               : rouge
lsi                       : false
excerpt_separator         : "\n\n"
incremental               : false


# -----------------------------------------------------------------------------
# Markdown Processing
# -----------------------------------------------------------------------------

kramdown:
  input                   : GFM
  hard_wrap               : false
  auto_ids                : true
  footnote_nr             : 1
  entity_output           : as_char
  toc_levels              : 1..6
  smart_quotes            : lsquo,rsquo,ldquo,rdquo
  enable_coderay          : false


# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:

  teaching:
    output                : true
    permalink             : /:collection/:path/

  publications:
    output                : true
    permalink             : /:collection/:path/

  portfolio:
    output                : true
    permalink             : /:collection/:path/

  talks:
    output                : true
    permalink             : /:collection/:path/


# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------

defaults:

  # Posts
  - scope:
      path                : ""
      type                : posts

    values:
      layout              : single
      author_profile      : true
      read_time           : true
      comments            : false
      share               : false
      related             : false


  # Pages
  - scope:
      path                : ""
      type                : pages

    values:
      layout              : single
      author_profile      : true


  # Teaching
  - scope:
      path                : ""
      type                : teaching

    values:
      layout              : single
      author_profile      : true
      share               : false
      comments            : false


  # Publications
  - scope:
      path                : ""
      type                : publications

    values:
      layout              : single
      author_profile      : true
      share               : false
      comments            : false


  # Portfolio
  - scope:
      path                : ""
      type                : portfolio

    values:
      layout              : single
      author_profile      : true
      share               : false
      comments            : false


  # Talks
  - scope:
      path                : ""
      type                : talks

    values:
      layout              : talk
      author_profile      : true
      share               : false


# -----------------------------------------------------------------------------
# Sass
# -----------------------------------------------------------------------------

sass:
  sass_dir                : _sass
  style                   : compressed


# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------

permalink                 : /:categories/:title/

timezone                  : Europe/Rome


# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# -----------------------------------------------------------------------------
# GitHub Pages whitelist
# -----------------------------------------------------------------------------

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# -----------------------------------------------------------------------------
# Archives
# -----------------------------------------------------------------------------

category_archive:
  type                    : liquid
  path                    : /categories/

tag_archive:
  type                    : liquid
  path                    : /tags/


# -----------------------------------------------------------------------------
# HTML Compression
# -----------------------------------------------------------------------------

compress_html:
  clippings               : all
  ignore:
    envs                  : development
    envs: development
